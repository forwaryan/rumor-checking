name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      LLM_API_KEY: test-key
      LLM_BASE_URL: http://gateway.test/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt ruff
      - run: ruff check backend/
      - run: |
          # test_retrieval.py excluded: test_retrieval_service_publishes_caller_stage_key_to_providers
          # hits live network (weixin.sogou.com, piyao.org.cn) and fails without connectivity.
          python -m pytest backend/tests/ -q \
            --ignore=backend/tests/test_retrieval.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
