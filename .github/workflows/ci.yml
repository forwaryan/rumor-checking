name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      LLM_API_KEY: test-key
      LLM_BASE_URL: http://gateway.test/v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt ruff
      - run: ruff check backend/
      - run: python backend/scripts/check_contracts.py
      - run: python -m pytest backend/tests/ -q
      - name: Run deterministic replay evaluation
        run: |
          mkdir -p artifacts
          python backend/scripts/replay_eval.py \
            --run-name "ci-${GITHUB_SHA::12}" \
            --output artifacts/replay-eval.json
      - name: Upload replay report
        uses: actions/upload-artifact@v4
        with:
          name: replay-eval-${{ github.sha }}
          path: artifacts/replay-eval.json
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
